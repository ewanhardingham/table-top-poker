name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: tsc-build-${{ hashFiles('packages/**/src/**', 'packages/*/tsconfig.json', 'tsconfig*.json') }}
          restore-keys: |
            tsc-build-

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: tsc-build-${{ hashFiles('packages/**/src/**', 'packages/*/tsconfig.json', 'tsconfig*.json') }}
          restore-keys: |
            tsc-build-

      - name: Build
        run: npm run build

      - name: Cache Vitest/Vite dependency cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vitest-${{ hashFiles('package-lock.json') }}

      - name: Diagnose runner CPU count
        run: nproc

      - name: Test
        run: npm test
