name: CI

# Documentation-only changes skip the suite entirely. `ci` is a required
# status check on main, and a workflow skipped by path filtering leaves its
# check pending forever — so ci-skip.yml carries the inverse filter and
# reports the same `ci` context. Keep the two path lists in sync.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
